# Required check contexts for org ruleset aviation-grade-main-org: ci, coverage.
# Job ids match the pagefeather engine (skyphusion-labs/pagefeather) naming.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ubuntu-latest ships PHP. Third-party setup actions are not needed.
      - run: php -v
      - name: PHP syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'wp-content/themes/**/*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no theme PHP files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            php -l "$f"
          done
      - name: Content JSON
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'content/*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no content JSON files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
      - name: Theme JS syntax
        run: |
          set -euo pipefail
          f=wp-content/themes/pagefeather-site/assets/js/site.js
          cp "$f" "$RUNNER_TEMP/check.mjs"
          node --check "$RUNNER_TEMP/check.mjs"
      - name: SEO and llms.txt
        run: |
          set -euo pipefail
          # Theme must not emit a hard-coded robots disallow meta in HTML.
          if git grep -nE "content=['\"][^'\"]*noindex|name=['\"]robots['\"]" -- \
            'wp-content/themes/**/*.php' 'wp-content/themes/**/*.html' 'wp-content/themes/**/*.js'; then
            echo "::error::theme must not hard-code robots disallow meta"
            exit 1
          fi
          # Theme must force blog_public so WordPress does not ask crawlers to skip.
          grep -q "pre_option_blog_public" wp-content/themes/pagefeather-site/functions.php
          grep -q "pagefeather_force_blog_public" wp-content/themes/pagefeather-site/functions.php
          echo "ok: blog_public force present"
          # Public /llms.txt is served from the theme file by functions.php.
          f=wp-content/themes/pagefeather-site/llms.txt
          test -s "$f"
          grep -q 'pagefeather.dev' "$f"
          grep -q 'https://www.pagefeather.dev/' "$f"
          grep -q 'https://github.com/skyphusion-labs/pagefeather' "$f"
          grep -q "llms.txt" wp-content/themes/pagefeather-site/functions.php
          echo "ok $f"
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No-op coverage artifact
        # This repo is a WordPress theme and content fixtures. It has no unit suite.
        # The org ruleset still requires a check context named coverage. Publish a
        # stub artifact so that context exists. Do not claim line coverage.
        run: |
          set -euo pipefail
          mkdir -p coverage
          cat > coverage/README.txt <<'EOF'
          pagefeather-dev has no PHP unit tests.
          This artifact satisfies the required coverage check context.
          It is not a measured coverage report.
          EOF
          echo "lines-total: 0" > coverage/summary.txt
          echo "lines-covered: 0" >> coverage/summary.txt
          echo "coverage-pct: n/a (no suite)" >> coverage/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-stub
          path: coverage/
          if-no-files-found: error
